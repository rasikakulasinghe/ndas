<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Resuscitation Functionality</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        #resuscitation-note {
            display: none;
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-top: 0.75rem;
            transition: all 0.3s ease;
        }
        
        #resuscitation-note label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #856404;
        }
        
        #resuscitation-note .form-control {
            border-color: #ffeaa7;
        }
        
        #resuscitation-note .form-control:focus {
            border-color: #f39c12;
            box-shadow: 0 0 0 0.2rem rgba(243, 156, 18, 0.25);
        }
        
        .custom-control-label::before {
            border-color: #28a745;
        }
        
        .custom-control-input:checked ~ .custom-control-label::before {
            background-color: #28a745;
            border-color: #28a745;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-success card-outline">
                    <div class="card-header">
                        <h3 class="card-title">
                            <i class="fas fa-baby"></i> Birth Information
                        </h3>
                    </div>
                    <div class="card-body">
                        <!-- APGAR Scores (placeholder) -->
                        <div class="form-group">
                            <label>APGAR Scores</label>
                            <div class="row">
                                <div class="col-4 text-center">
                                    <small class="d-block text-muted mb-1">1 min</small>
                                    <input type="number" class="form-control" placeholder="0-10">
                                </div>
                                <div class="col-4 text-center">
                                    <small class="d-block text-muted mb-1">5 min</small>
                                    <input type="number" class="form-control" placeholder="0-10">
                                </div>
                                <div class="col-4 text-center">
                                    <small class="d-block text-muted mb-1">10 min</small>
                                    <input type="number" class="form-control" placeholder="0-10">
                                </div>
                            </div>
                        </div>

                        <!-- Resuscitation Checkbox -->
                        <div class="row">
                            <div class="col-12">
                                <div class="form-group">
                                    <div class="custom-control custom-checkbox">
                                        <input type="checkbox" class="custom-control-input" id="id_resuscitated">
                                        <label class="custom-control-label" for="id_resuscitated">
                                            Required Resuscitation
                                        </label>
                                    </div>
                                    
                                    <!-- Resuscitation Notes - appears directly below checkbox -->
                                    <div id="resuscitation-note" class="mt-3" style="display: none;">
                                        <div class="form-group mb-0">
                                            <label for="id_resustn_note">Resuscitation Notes <span class="text-danger">*</span></label>
                                            <textarea class="form-control" id="id_resustn_note" rows="3" placeholder="Detailed notes about resuscitation procedures if applicable"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Test Buttons -->
                        <div class="row mt-3">
                            <div class="col-12">
                                <button type="button" class="btn btn-primary" onclick="testToggle()">
                                    <i class="fas fa-flask"></i> Test Toggle
                                </button>
                                <button type="button" class="btn btn-info" onclick="getValues()">
                                    <i class="fas fa-info"></i> Get Values
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // Resuscitation toggle functionality
            function toggleResuscitationNote() {
                const isChecked = $('#id_resuscitated').is(':checked');
                const noteContainer = $('#resuscitation-note');
                const noteTextArea = $('#id_resustn_note');
                
                console.log('Toggling resuscitation note. Checked:', isChecked);
                
                if (isChecked) {
                    noteContainer.slideDown(300, function() {
                        // Focus on textarea after animation completes
                        noteTextArea.focus();
                    });
                    noteTextArea.attr('required', true);
                } else {
                    noteContainer.slideUp(300);
                    noteTextArea.removeAttr('required').val('');
                }
            }
            
            // Bind the toggle function to checkbox change
            $('#id_resuscitated').on('change', toggleResuscitationNote);
            
            // Initialize resuscitation toggle on page load
            toggleResuscitationNote();
            
            // Debug: Log when resuscitation checkbox is interacted with
            $('#id_resuscitated').on('click', function() {
                console.log('Resuscitation checkbox clicked:', $(this).is(':checked'));
            });
        });

        // Test functions
        function testToggle() {
            const checkbox = $('#id_resuscitated');
            checkbox.prop('checked', !checkbox.is(':checked')).trigger('change');
        }

        function getValues() {
            const isChecked = $('#id_resuscitated').is(':checked');
            const noteValue = $('#id_resustn_note').val();
            alert(`Resuscitated: ${isChecked}\nNotes: "${noteValue}"`);
        }
    </script>
</body>
</html>
