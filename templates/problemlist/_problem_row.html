{% load static %}
<!-- HTMX Swap Target - Single Problem Row for Status Changes -->

<tr class="{% if problem.status in 'resolved,inactive' %}text-muted{% endif %}" id="problem-row-{{ problem.pk }}">
  <td>{{ problem.date_identified|date:"Y-m-d" }}</td>
  <td>
    <strong>{{ problem.name }}</strong>
    {% if problem.description %}
    <br><small class="text-muted">{{ problem.description|truncatewords:15 }}</small>
    {% endif %}
  </td>
  <td>
    <span class="badge badge-{{ problem.get_status_badge_class }}">
      {{ problem.get_status_display }}
    </span>
  </td>
  <td>
    {% if problem.severity %}
    <span class="badge badge-{{ problem.get_severity_badge_class }}">
      {{ problem.get_severity_display }}
    </span>
    {% else %}
    <span class="text-muted">N/A</span>
    {% endif %}
  </td>
  <td>
    <a href="{% url 'problem-view' problem.pk %}" class="btn btn-sm btn-info" title="View">
      <i class="fas fa-eye"></i>
    </a>
    <a href="{% url 'problem-edit' problem.pk %}" class="btn btn-sm btn-warning" title="Edit">
      <i class="fas fa-edit"></i>
    </a>
    <a href="{% url 'problem-delete' problem.pk %}"
       class="btn btn-sm btn-danger"
       title="Delete"
       onclick="return confirm('Are you sure you want to delete this problem?');">
      <i class="fas fa-trash"></i>
    </a>
  </td>
</tr>
