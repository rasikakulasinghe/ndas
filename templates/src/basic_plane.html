{% load static %}
<!DOCTYPE html>
<!--
This is a starter template page. Use this page to start your new project from
scratch. This page gets rid of all links and provides the needed markup only.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>NDAS : {% block title %}{% endblock title %}</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap 4 (required for AdminLTE 3.x) with fallback -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css'">

  <!-- AdminLTE Theme style (Stable version 3.2) with fallback -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css'">
  
  <!-- Custom CSS files (keeping essential local only) -->
  <link rel="stylesheet" href="{% static 'css/social.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom_css.css' %}">
  <link rel="stylesheet" href="{% static 'css/ndas-sidebar.css' %}">

  <!-- Select2 CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">

  <!-- Video.js CSS from CDN -->
  <link rel="stylesheet" href="https://vjs.zencdn.net/8.10.0/video-js.css">

  {% block extra_css %}
  {% endblock extra_css %}

</head>
<body class="hold-transition sidebar-mini layout-fixed">

{% block mainbody %}


{% endblock mainbody %}

<!-- REQUIRED SCRIPTS -->

<!-- jQuery (Critical - load first, synchronously) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"
        integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ=="
        crossorigin="anonymous"></script>

<!-- Bootstrap 4 (Required for AdminLTE) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
        crossorigin="anonymous"></script>

<!-- AdminLTE App from CDN -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

<!-- HTMX from CDN -->
<script src="https://unpkg.com/htmx.org@1.9.12"
        integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2"
        crossorigin="anonymous"></script>

<!-- Select2 from CDN -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- Chart.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

<!-- Video.js from CDN -->
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

<!-- Video.js plugins -->
<script src="{% static 'js/videojs-failsafe.js' %}"></script>
<script src="{% static 'js/zoomrotate.js' %}" defer></script>
<script src="{% static 'js/rotate.js' %}" defer></script>

<!-- NDAS Application Scripts (with defer for optimal loading) -->
<script src="{% static 'js/app-utils.js' %}" defer></script>
<script src="{% static 'js/video-manager.js' %}" defer></script>
<script src="{% static 'js/main.js' %}" defer></script>
<script src="{% static 'js/logout-modal.js' %}" defer></script>

<!-- CDN Health Check (runs after all scripts load) -->
<script>
// Wait for window.load to ensure all external scripts are fully loaded
window.addEventListener('load', function() {
    // Additional delay to ensure script execution completes
    setTimeout(function() {
        const errors = [];
        const warnings = [];

        // Check critical dependencies only
        if (typeof jQuery === 'undefined' || typeof $ === 'undefined') {
            errors.push('jQuery');
        }
        if (typeof $.fn === 'undefined' || typeof $.fn.modal === 'undefined') {
            errors.push('Bootstrap');
        }

        // Optional dependencies - warn but don't fail
        if (typeof window.htmx === 'undefined') {
            warnings.push('HTMX');
        }
        if (typeof window.videojs === 'undefined') {
            warnings.push('Video.js');
        }

        // Show critical errors
        if (errors.length > 0) {
            console.error('❌ Critical CDN Failures:', errors.join(', '));
            document.body.insertAdjacentHTML('afterbegin',
                '<div class="alert alert-danger alert-dismissible m-3">' +
                '<button type="button" class="close" data-dismiss="alert">&times;</button>' +
                '<strong>Critical Error:</strong> Essential resources failed to load (' + errors.join(', ') + '). Please refresh the page.</div>'
            );
        }

        // Log optional warnings (not shown to user)
        if (warnings.length > 0) {
            console.warn('⚠️ Optional resources not loaded:', warnings.join(', '));
        }
    }, 150);
});
</script>

{% block extra_js %}
{% endblock extra_js %}





















</body>
</html>
