{% load static %}
<!DOCTYPE html>
<!--
This is a starter template page. Use this page to start your new project from
scratch. This page gets rid of all links and provides the needed markup only.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NDAS : {% block title %}{% endblock title %}</title>

  <!-- Source Sans Pro (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/fonts/source-sans-pro/source-sans-pro.css' %}">

  <!-- Font Awesome Icons (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">

  <!-- Bootstrap 4 (required for AdminLTE 3.x) (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">

  <!-- AdminLTE Theme style (Stable version 3.2) (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/adminlte/css/adminlte.min.css' %}">

  <!-- Custom CSS files (keeping essential local only) -->
  <link rel="stylesheet" href="{% static 'css/social.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom_css.css' %}">
  <link rel="stylesheet" href="{% static 'css/ndas-sidebar.css' %}">
  <link rel="stylesheet" href="{% static 'css/delete-confirmation.css' %}">

  <!-- Select2 CSS (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/select2/css/select2.min.css' %}">

  <!-- Video.js CSS (self-hosted) -->
  <link rel="stylesheet" href="{% static 'vendor/videojs/video-js.min.css' %}">

  {% block extra_css %}
  {% endblock extra_css %}

</head>
<body class="{% block body_class %}hold-transition{% endblock body_class %}">

{% block mainbody %}


{% endblock mainbody %}

<!-- REQUIRED SCRIPTS (all self-hosted; see static/vendor/) -->

<!-- jQuery (Critical - load first, synchronously) -->
<script src="{% static 'vendor/jquery/jquery.min.js' %}"></script>

<!-- Bootstrap 4 (Required for AdminLTE) -->
<script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

<!-- AdminLTE App -->
<script src="{% static 'vendor/adminlte/js/adminlte.min.js' %}"></script>

<!-- HTMX -->
<script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>

<!-- Select2 -->
<script src="{% static 'vendor/select2/js/select2.min.js' %}"></script>

<!-- Chart.js -->
<script src="{% static 'vendor/chartjs/chart.umd.js' %}"></script>

<!-- Video.js -->
<script src="{% static 'vendor/videojs/video.min.js' %}"></script>

<!-- Video.js plugins -->
<script src="{% static 'js/videojs-failsafe.js' %}"></script>
<script src="{% static 'js/zoomrotate.js' %}" defer></script>
<script src="{% static 'js/rotate.js' %}" defer></script>

<!-- NDAS Application Scripts -->
<!-- Critical scripts without defer to ensure they're available for inline handlers -->
<script src="{% static 'js/delete-confirmation.js' %}"></script>
<script src="{% static 'js/event-handlers.js' %}"></script>
<script src="{% static 'js/logout-modal.js' %}"></script>
<!-- Non-critical scripts with defer for optimal loading -->
<script src="{% static 'js/app-utils.js' %}" defer></script>
<script src="{% static 'js/video-manager.js' %}" defer></script>
<script src="{% static 'js/main.js' %}" defer></script>

<!-- Dependency Health Check (runs after all scripts load) -->
<script nonce="{{ request.csp_nonce }}">
// Wait for window.load to ensure all external scripts are fully loaded
window.addEventListener('load', function() {
    // Additional delay to ensure script execution completes
    setTimeout(function() {
        const errors = [];
        const warnings = [];

        // Check critical dependencies only
        if (typeof jQuery === 'undefined' || typeof $ === 'undefined') {
            errors.push('jQuery');
        }
        if (typeof $.fn === 'undefined' || typeof $.fn.modal === 'undefined') {
            errors.push('Bootstrap');
        }

        // Optional dependencies - warn but don't fail
        if (typeof window.htmx === 'undefined') {
            warnings.push('HTMX');
        }
        if (typeof window.videojs === 'undefined') {
            warnings.push('Video.js');
        }

        // Show critical errors
        if (errors.length > 0) {
            console.error('❌ Critical Failures:', errors.join(', '));
            document.body.insertAdjacentHTML('afterbegin',
                '<div class="alert alert-danger alert-dismissible m-3">' +
                '<button type="button" class="close" data-dismiss="alert">&times;</button>' +
                '<strong>Critical Error:</strong> Essential resources failed to load (' + errors.join(', ') + '). Please refresh the page.</div>'
            );
        }

        // Log optional warnings (not shown to user)
        if (warnings.length > 0) {
            console.warn('⚠️ Optional resources not loaded:', warnings.join(', '));
        }
    }, 150);
});
</script>

{% block extra_js %}
{% endblock extra_js %}

</body>
</html>
