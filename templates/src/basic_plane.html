{% load static %}
<!DOCTYPE html>
<!--
This is a starter template page. Use this page to start your new project from
scratch. This page gets rid of all links and provides the needed markup only.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <title>NDAS : {% block title %}{% endblock title %}</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Bootstrap 4 (required for AdminLTE 3.x) with fallback -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/css/bootstrap.min.css'">

  <!-- AdminLTE Theme style (Stable version 3.2) with fallback -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css'">
  
  <!-- Custom CSS files (keeping essential local only) -->
  <link rel="stylesheet" href="{% static 'css/social.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom_css.css' %}">
  <link rel="stylesheet" href="{% static 'css/ndas-sidebar.css' %}">

  <!-- Select2 CSS from CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">

  <!-- CSS for Video Js -->
  <link href="https://vjs.zencdn.net/8.0.4/video-js.css" rel="stylesheet" />

  {% block extra_css %}
  {% endblock extra_css %}

</head>
<body class="hold-transition sidebar-mini layout-fixed">

{% block mainbody %}


{% endblock mainbody %}

<!-- REQUIRED SCRIPTS -->

<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
// Verify jQuery loaded before proceeding
if (typeof jQuery === 'undefined') {
    console.error('❌ jQuery failed to load!');
    document.write('<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"><\/script>');
}
</script>
<!-- Bootstrap 4 with fallback -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" onerror="document.write('<script src=\"https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.2/js/bootstrap.bundle.min.js\"><\/script>')"></script>
<!-- AdminLTE App with fallback -->
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js" onerror="document.write('<script src=\"https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js\"><\/script>')"></script>
<!-- HTMX from CDN -->
<script src="https://unpkg.com/htmx.org@1.9.12"></script>

<!-- Select2 from CDN -->
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<!-- Bootstrap initialization is now handled by main.js (NDASApp) -->
<!-- Removed duplicate initialization code for cleaner, more maintainable codebase -->

<!-- If you'd like to support IE8 (for Video.js versions prior to v7) -->
<!-- Removed duplicate script: script src="https://vjs.zencdn.net/ie8/1.1.2/videojs-ie8.min.js" -->

<!-- Library for Chart Js (using UMD version to avoid module import errors) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

<!-- Library for Video Js -->
<script src="https://vjs.zencdn.net/8.0.4/video.min.js"></script>

<!-- Video.js failsafe wrapper to prevent initialization errors -->
<script type="text/javascript" src="{% static 'js/videojs-failsafe.js' %}"></script>

<!-- Video.js zoom rotate plugin -->
<script type="text/javascript" src="{% static 'js/zoomrotate.js' %}" defer></script>

<!-- Custom rotate functionality -->
<script type="text/javascript" src="{% static 'js/rotate.js' %}" defer></script>

<!-- Video.js initialization handled by video-manager.js -->
<!-- Video.js loading verification removed - handled by video-manager.js -->

<!-- NDAS utility functions -->
<script type="text/javascript" src="{% static 'js/app-utils.js' %}"></script>

<!-- Video Manager (handles all video initialization) -->
<script type="text/javascript" src="{% static 'js/video-manager.js' %}"></script>

<!-- Main application JavaScript -->
<script type="text/javascript" src="{% static 'js/main.js' %}"></script>

<!-- Logout modal functionality -->
<script type="text/javascript" src="{% static 'js/logout-modal.js' %}"></script>

<!-- AdminLTE sidebar navigation is now handled by main.js (NDASApp.initAdminLTE) -->
<!-- Removed duplicate sidebar initialization for cleaner codebase -->

<!-- Debug script - COMMENTED OUT FOR PRODUCTION -->
<!-- Uncomment only for debugging: <script type="text/javascript" src="{% static 'js/debug.js' %}"></script> -->

{% block extra_js %}
{% endblock extra_js %}





















</body>
</html>
