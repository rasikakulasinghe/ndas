# Workflow Status Template

# This tracks progress through BMM methodology Analysis, Planning, and Solutioning phases.
# Implementation phase is tracked separately in sprint-status.yaml

# STATUS DEFINITIONS:
# ==================
# Initial Status (before completion):
#   - required: Must be completed to progress
#   - optional: Can be completed but not required
#   - recommended: Strongly suggested but not required
#   - conditional: Required only if certain conditions met (e.g., if_has_ui)
#
# Completion Status:
#   - {file-path}: File created/found (e.g., "docs/product-brief.md")
#   - skipped: Optional/conditional workflow that was skipped

generated: "2025-12-29"
project: "NDAS"
project_type: "software"
selected_track: "method"
field_type: "brownfield"
workflow_path: "_bmad/bmm/workflows/workflow-status/paths/method-brownfield.yaml"
discovery_workflows:
  brainstorm: true
  research: true
  product_brief: false
workflow_status:
  # PREREQUISITE - Brownfield Documentation
  - id: "document-project"
    name: "Document Project"
    agent: "analyst"
    command: "/bmad:bmm:workflows:document-project"
    phase: "prerequisite"
    status: "docs/index.md"
    output: "Comprehensive project documentation"
    note: "COMPLETED: 6 documentation files generated (130KB total) - exhaustive scan"
    completed_date: "2025-12-29"

  # PHASE 0 - Discovery (Optional - User Selected)
  - id: "brainstorm"
    name: "Brainstorm Project"
    agent: "analyst"
    command: "/bmad:bmm:workflows:brainstorm-project"
    phase: "discovery"
    status: "optional"
    note: "Creative exploration and ideation"

  - id: "research"
    name: "Research"
    agent: "analyst"
    command: "/bmad:bmm:workflows:research"
    phase: "discovery"
    status: "optional"
    note: "Technical/domain/competitive analysis"

  # PHASE 1 - Planning
  - id: "create-prd"
    name: "Create PRD"
    agent: "pm"
    command: "/bmad:bmm:workflows:create-prd"
    phase: "planning"
    status: "_bmad-output/planning-artifacts/prd.md"
    output: "PRD focused on new features/changes"
    note: "COMPLETED: Comprehensive PRD generated - all 11 steps finished"
    completed_date: "2026-02-18"

  - id: "create-ux-design"
    name: "Create UX Design"
    agent: "ux-designer"
    command: "/bmad:bmm:workflows:create-ux-design"
    phase: "planning"
    status: "conditional"
    condition: "if_has_ui"
    note: "Required if project involves UI changes"

  # PHASE 2 - Solutioning
  - id: "create-architecture"
    name: "Create Architecture"
    agent: "architect"
    command: "/bmad:bmm:workflows:create-architecture"
    phase: "solutioning"
    status: "recommended"
    output: "Integration architecture - solution design for THIS project"
    note: "HIGHLY RECOMMENDED: Distills massive brownfield context into focused solution design. Prevents agent confusion."

  - id: "create-epics-and-stories"
    name: "Create Epics & Stories"
    agent: "pm"
    command: "/bmad:bmm:workflows:create-epics-and-stories"
    phase: "solutioning"
    status: "required"
    note: "Break down PRD into implementable epics and stories with full context (PRD + UX + Architecture)"

  - id: "testarch-test-design"
    name: "Test Design"
    agent: "tea"
    command: "/bmad:bmm:workflows:testarch-test-design"
    phase: "solutioning"
    status: "recommended"
    output: "System-level testability review"
    note: "Testability assessment before gate check - auto-detects system-level mode"

  - id: "validate-architecture"
    name: "Validate Architecture"
    agent: "architect"
    command: "/bmad:bmm:workflows:validate-architecture"
    phase: "solutioning"
    status: "optional"

  - id: "check-implementation-readiness"
    name: "Implementation Readiness Check"
    agent: "architect"
    command: "/bmad:bmm:workflows:check-implementation-readiness"
    phase: "solutioning"
    status: "required"
    note: "Validates PRD + Architecture + Epics + UX (optional)"

  # PHASE 3 - Implementation
  - id: "sprint-planning"
    name: "Sprint Planning"
    agent: "sm"
    command: "/bmad:bmm:workflows:sprint-planning"
    phase: "implementation"
    status: "required"
    note: "Creates sprint plan with stories - tracked in sprint-status.yaml"
